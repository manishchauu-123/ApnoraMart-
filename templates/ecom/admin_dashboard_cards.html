<div class="row g-4 mb-4">
  
  <!-- Total Customers Card -->
  <div class="col-md-4">
    <div style="background:linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); border-radius:16px; padding:24px; color:#fff; box-shadow:0 10px 25px rgba(239,68,68,0.2); display:flex; align-items:center; justify-content:space-between; border:none;" class="hover-lift">
      <div>
        <h3 style="font-size:36px; font-weight:900; margin:0; letter-spacing:-0.03em; line-height:1;">{{customercount}}</h3>
        <h4 style="font-size:14px; font-weight:700; margin:6px 0 0 0; text-transform:uppercase; letter-spacing:0.04em; opacity:0.9;">Total Customers</h4>
      </div>
      <div style="width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; font-size:24px; color:#fff; border:1px solid rgba(255,255,255,0.2);">
        <i class="fa-solid fa-users"></i>
      </div>
    </div>
  </div>

  <!-- Total Products Card -->
  <div class="col-md-4">
    <div style="background:linear-gradient(135deg, #f97316 0%, #c2410c 100%); border-radius:16px; padding:24px; color:#fff; box-shadow:0 10px 25px rgba(249,115,22,0.2); display:flex; align-items:center; justify-content:space-between; border:none;" class="hover-lift">
      <div>
        <h3 style="font-size:36px; font-weight:900; margin:0; letter-spacing:-0.03em; line-height:1;">{{productcount}}</h3>
        <h4 style="font-size:14px; font-weight:700; margin:6px 0 0 0; text-transform:uppercase; letter-spacing:0.04em; opacity:0.9;">Total Products</h4>
      </div>
      <div style="width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; font-size:24px; color:#fff; border:1px solid rgba(255,255,255,0.2);">
        <i class="fa-solid fa-boxes-stacked"></i>
      </div>
    </div>
  </div>

  <!-- Total Orders Card -->
  <div class="col-md-4">
    <div style="background:linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); border-radius:16px; padding:24px; color:#fff; box-shadow:0 10px 25px rgba(59,130,246,0.2); display:flex; align-items:center; justify-content:space-between; border:none;" class="hover-lift">
      <div>
        <h3 style="font-size:36px; font-weight:900; margin:0; letter-spacing:-0.03em; line-height:1;">{{ordercount}}</h3>
        <h4 style="font-size:14px; font-weight:700; margin:6px 0 0 0; text-transform:uppercase; letter-spacing:0.04em; opacity:0.9;">Total Orders</h4>
      </div>
      <div style="width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; font-size:24px; color:#fff; border:1px solid rgba(255,255,255,0.2);">
        <i class="fa-solid fa-cart-shopping"></i>
      </div>
    </div>
  </div>

</div>
