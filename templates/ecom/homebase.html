{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <!-- 🚀 MOBILE RESPONSIVENESS KE LIYE SABSE ZAROORI TAG -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>ApnoraMart</title>

  <!-- Bootstrap 5 CSS & FontAwesome Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
        background-color: #f1f2f4;
        font-family: 'Roboto', Arial, sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden; /* Mobile par unwanted horizontal scroll ko rokta hai */
    }
  </style>
</head>

<body>
  <!-- Navbar Include -->
  {% include "ecom/navbar.html" %}

  <!-- Main Content Area -->
  <main>
    {% block content %}
    {% endblock content %}
  </main>

  <!-- Footer Include -->
  {% include "ecom/footer.html" %}

  <!-- Bootstrap 5 JS Bundle (Dropdowns aur Mobile Menu ke liye) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
