{% extends 'ecom/customer_base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 card p-4 shadow-sm">
            <h3 class="text-center mb-4">Share Your Experience</h3>
            <div class="text-center mb-3">
                <img src="{{product.product_image.url}}" width="100" class="rounded">
                <h5 class="mt-2">{{product.name}}</h5>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label>How much did you like it? (1 to 5 Stars)</label>
                    <select name="rating" class="form-control">
                        <option value="5">⭐⭐⭐⭐⭐ (Excellent)</option>
                        <option value="4">⭐⭐⭐⭐ (Good)</option>
                        <option value="3">⭐⭐⭐ (Average)</option>
                        <option value="2">⭐⭐ (Poor)</option>
                        <option value="1">⭐ (Very Bad)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label>Write your review:</label>
                    <textarea name="feedback" class="form-control" rows="4" placeholder="Saman kaisa laga? Local vendor ki service kaisi thi?" required></textarea>
                </div>
                <button type="submit" class="btn btn-warning btn-block font-weight-bold">Submit Review</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
